<html lang="en">
<head><title>WebSocket Test Client</title></head>
<body>
<div>
    <p>Check the console, nerd.</p>
</div>
</body>
<script>
    const ws = new WebSocket('ws://localhost:7712', 'db')
    ws.onopen = (event)=>{
        ws.send(JSON.stringify({
            key: 'Main',
            group: 'ConfigMain'
        }))
    }
    ws.onmessage = (event)=>{
        console.log(event.data)
    }
    const ws2 = new WebSocket('ws://localhost:7712', ['presenter', 'future-password', '0'])
    ws2.onopen = ()=>{ console.log('Connected') }
    ws2.onclose = ()=>{ console.warn('Disconnected')}
    ws2.onerror = ()=>{ console.error('Error') }
    ws2.onmessage = (event)=>{
        console.log(event.data)
    }
</script>
</html>
